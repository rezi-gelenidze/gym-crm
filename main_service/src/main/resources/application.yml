server:
  port: 8081

spring:
  application:
    name: main-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  activemq:
    broker-url: ${SPRING_ACTIVEMQ_BROKER_URL}
    user: ${SPRING_ACTIVEMQ_USER}
    password: ${SPRING_ACTIVEMQ_PASSWORD}

  mvc:
    servlet:
      path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,custom-health,custom-metrics
  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

app:
  auth:
    max-attempts: ${AUTH_MAX_ATTEMPTS}
    block-duration-ms: ${AUTH_BLOCK_DURATION}
    jwt-expiration: ${AUTH_JWT_EXPIRATION}
    jwt-secret: ${AUTH_JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    register-with-eureka: true


resilience4j:
  circuitbreaker:
    instances:
      workloadService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      workloadService:
        maxAttempts: 3
        waitDuration: 1s
