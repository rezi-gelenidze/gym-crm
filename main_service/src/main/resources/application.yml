server:
  port: 8081

spring:
  application:
    name: main-service

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  mvc:
    servlet:
      path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,custom-health,custom-metrics
  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

app:
  auth:
    max-attempts: 3
    block-duration-ms: 300000 # 5 minutes
    jwt-expiration: 36000000 # 10 hours
    jwt-secret: SECURE_2048_BIT_QUANTUM_RANDOM_SUPER_DUPER_STRONG_SECRET_KEY


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    register-with-eureka: true


resilience4j:
  circuitbreaker:
    instances:
      workloadService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      workloadService:
        maxAttempts: 3
        waitDuration: 1s
