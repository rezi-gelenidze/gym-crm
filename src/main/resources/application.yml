spring:
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  mvc:
    servlet:
      path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,custom-health,custom-metrics
  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

app:
  seed:
    file:
      path: src/main/resources/seed.json
